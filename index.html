<!DOCTYPE html> 
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <!-- Meta viewport 確保手機裝置可以正確縮放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>懿昇土地藝術生活訂購單</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0; /* 全站的背景色 */
      font-family: Arial, sans-serif;
    }
    /* 主訊息區塊設置凸顯效果 */
    #loading {
      font-size: 1.5rem;
      text-align: center;
      padding: 1rem 2rem;
      background-color: #fff;  /* #loading的底色 */
      border: 2px solid #e0e0e0; /* 輕微邊框 */
      border-radius: 8px;       /* 圓角效果 */
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); /* 陰影效果凸顯元素 */
      animation: fadeInOut 0.8s ease-in-out infinite;
    }
    @keyframes fadeInOut {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
    }
    /* 響應式設計：手機尺寸下字體微調 */
    @media (max-width: 480px) {
      #loading {
        font-size: 1.2rem;
        padding: 0.8rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="loading">載入懿昇，慢活一生...</div>

  <script>
    window.addEventListener("load", function () {
      const apiUrl = "https://order013.de.r.appspot.com/api/ping";

      fetch(apiUrl)
        .then((response) => {
          if (!response.ok) throw new Error("伺服器尚未就緒");
          return response.text();
        })
        .then(() => {
          // 導向正式首頁
          window.location.href = "https://order013.de.r.appspot.com/";
        })
        .catch((error) => {
          document.getElementById("loading").textContent =
            "伺服器啟動中，請稍後自動重新載入...";
          console.error("錯誤：", error);

          // 每 3 秒再試一次
          setTimeout(() => location.reload(), 3000);
        });
    });
  </script>
</body>
</html>

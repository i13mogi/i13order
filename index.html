<!DOCTYPE html> 
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>懿昇土地藝術生活訂購單</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      /* 使用 Flex 置中 */
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9f9f9; /* 可視需求調整背景色 */
    }
    #loading {
      font-size: 1.5rem;
      text-align: center;
      /* 加入淡入淡出動畫 */
      animation: fadeInOut 2s ease-in-out infinite;
    }
    @keyframes fadeInOut {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="loading">載入懿昇，慢活一生...</div>

  <script>
    window.addEventListener("load", function () {
      const apiUrl = "https://order013.de.r.appspot.com/api/ping";

      fetch(apiUrl)
        .then((response) => {
          if (!response.ok) throw new Error("伺服器尚未就緒");
          return response.text();
        })
        .then(() => {
          // 導向正式首頁
          window.location.href = "https://order013.de.r.appspot.com/";
        })
        .catch((error) => {
          document.getElementById("loading").textContent =
            "伺服器啟動中，請稍後自動重新載入...";
          console.error("錯誤：", error);

          // 每 3 秒再試一次
          setTimeout(() => location.reload(), 3000);
        });
    });
  </script>
</body>
</html>
